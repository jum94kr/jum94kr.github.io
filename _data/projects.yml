- layout: left
  name: Cloud VPN Through Put Test (2025)
  quote: "" # 빈 문자열로 처리
  description: |
    This project involved building a cloud-native test environment across AWS, Azure, and GCP to evaluate the performance of VPN, Firewall, and SSLVPN connections between on-premise devices and cloud VMs.
    Spirent TestCenter was used to measure throughput under various network conditions and security configurations.
    
    My Role
    Designed and deployed cloud network environments for VPN testing
    * Configured routing, security groups, NACLs, and VPC structures
    * Integrated and connected VPN Gateways and Customer Gateways
    * Connected Spirent devices and automated performance measurements
    * Troubleshot and validated communication between cloud VMs and on-premise systems
    
- layout: left
  name: KOREA SEVEN (7-ELEVEN) – Disaster Recovery (DR) Center Deployment (2024)
  quote: "" # 빈 문자열로 처리
  description: |
    Deployed and configured a Disaster Recovery (DR) center for KOREA SEVEN (7-ELEVEN) to ensure uninterrupted communication with nationwide branches during main site failures. The system was designed to automatically switch to the DR center in case of a failure.
    
    My Role
    * Deployed and configured VPN equipment at the DR site
    * Built secure VPN tunnels between DR center and nationwide branch locations
    * Implemented failure detection and automated routing failover to the DR center
    * Designed and tested Active-Standby HA configuration for DR environment

- layout: left
