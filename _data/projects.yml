- layout: left
  name: "Cloud VPN Through Put Test"
  quote: ""
  description: >
    This project involved building a cloud-native test environment across AWS, Azure, and GCP to evaluate the performance 
    of VPN, Firewall, and SSLVPN connections between on-premise devices and cloud VMs.
    Spirent TestCenter was used to measure throughput under various network conditions and security configurations.<br><br>

    <strong>My Contributions</strong><br>
    <div style="font-size: 1.05rem; line-height: 1.7;">
      <p>• Designed and deployed cloud network environments for VPN testing</p>
      <p>• Configured routing, security groups, NACLs, and VPC structures</p>
      <p>• Integrated and connected VPN Gateways and Customer Gateways</p>
      <p>• Connected Spirent devices and automated performance measurements</p>
      <p>• Troubleshot and validated communication between cloud VMs and on-premise systems</p>
    </div>

- layout: left
  name: "7-ELEVEN – Disaster Recovery Center Deployment"
  quote: ""
  description: >
    Deployed and configured a Disaster Recovery (DR) center for KOREA SEVEN (7-ELEVEN) to ensure uninterrupted communication 
    with nationwide branches during main site failures. The system was designed to automatically switch to the DR center in case of a failure.<br><br>

    <strong>My Contributions</strong><br>
    <div style="font-size: 1.05rem; line-height: 1.7;">
      <p>• Deployed and configured VPN equipment at the DR site</p>
      <p>• Built secure VPN tunnels between DR center and nationwide branch locations</p>
      <p>• Implemented failure detection and automated routing failover to the DR center</p>
      <p>• Designed and tested Active-Standby HA configuration for DR environment</p>
    </div>

