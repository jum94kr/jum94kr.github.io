- layout: left
  name: FLIGHT SCHEDULE
  link: https://flight-lookup.vercel.app/
  github: jum94kr/flight-lookup
  quote: "" # 여기도 빈 문자열로 처리
  description: |
    The Flight Schedule project represents a personal endeavor in which I sought to gain deeper knowledge and experience with <mark>API request handling</mark>. My passion for managing flight schedules, developed through extensive global travel, fueled my interest in leveraging an API from API Hub to enrich my learning experience. To enhance the quality and organization of the project, I utilized <mark>styled components</mark>, a styling library that provides a more modular, maintainable, and efficient approach to styling <mark>React</mark> components. Additionally, I implemented <mark>TypeScript</mark> to improve the overall code quality, maintainability, and scalability of the project. The strong typing system of <mark>TypeScript</mark> enabled me to better structure the code and provide more comprehensive documentation, while also improving tooling support.
