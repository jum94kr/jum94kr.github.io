{% assign experience_data = site.data.experience %}
{% if page.lang == "en" %}
  {% assign experience_data = site.data.experience_en %}
{% endif %}

{% for exp in experience_data %}
  <div class="exp-entry">
    <h3>{{ exp.position }} @ {{ exp.company }}</h3>
    <p>{{ exp.dates }}</p>
    <p>{{ exp.description }}</p>
  </div>
{% endfor %}
