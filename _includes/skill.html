{% assign skill_data = site.data.skill %}
{% if page.lang == "en" %}
  {% assign skill_data = site.data.skill_en %}
{% endif %}

{% for category in skill_data %}
  <div class="skill-category">
    <h4>{{ category.category }}</h4>
    <ul>
      {% for item in category.items %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
{% endfor %}
