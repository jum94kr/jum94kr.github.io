<div class="about-container">
  <img src="{{ site.avatar }}" alt="Profile picture">
  <div class="about-text">
    <h2><i class="fas fa-user-gear"></i> About Me</h2>
    <p><i class="fas fa-network-wired"></i> {{ site.description }}</p>
    <p><i class="fas fa-envelope"></i> {{ site.email }}</p>
    <p><i class="fas fa-globe"></i> {{ site.url }}</p>
  </div>
</div>
