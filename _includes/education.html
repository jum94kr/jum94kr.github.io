{% assign education_data = site.data.education %}
{% if page.lang == "en" %}
  {% assign education_data = site.data.education_en %}
{% endif %}

{% for edu in education_data %}
  <div class="edu-entry">
    <h3>{{ edu.degree }}</h3>
    <p>{{ edu.university }} | {{ edu.dates }}</p>
    <p>{{ edu.description }}</p>
  </div>
{% endfor %}
